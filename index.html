<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>网申资料库</title>
<style>
  :root{
    --ink:#1d1d1f;
    --ink-soft:#5f5f64;
    --ink-faint:#97979c;
    --paper:#ebebe8;
    --surface:#ffffff;
    --surface-alt:#f1f1ef;
    --line:rgba(0,0,0,.09);
    --line-soft:rgba(0,0,0,.06);
    --lime:#cfdc8e;
    --lime-soft:#f2f5df;
    --lavender:#aaa4d9;
    --lavender-soft:#eeedf9;
    --charcoal:#262628;
    --purple-ink:#5d53a6;
    --accent:#cfdc8e;
    --accent-line:#a9bd45;
    --accent-dark:#4b5c12;
    --accent-bg:#f2f5df;
    --good:#6b861c;
    --good-bg:#dfe9ac;
    --danger:#c0414d;
    --danger-bg:#fbe7e8;
    --radius-sm:12px;
    --radius:20px;
    --radius-lg:26px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow-card:0 6px 18px rgba(0,0,0,.05);
    --shadow-md:0 1px 3px rgba(0,0,0,.05), 0 14px 28px -16px rgba(0,0,0,.16);
    --shadow-lg:0 20px 60px rgba(0,0,0,.28);
    --ease:cubic-bezier(.25,.8,.35,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --scroll-offset:70px;
    --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- Lock screen ---------- */
  #lockScreen{
    position:fixed;inset:0;
    background:linear-gradient(180deg,#1d1d1f 0%,#2e2e31 100%);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  #lockScreen.hidden{display:none;}
  .lock-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:38px 32px;
    width:100%;max-width:320px;
    box-shadow:var(--shadow-lg);
    text-align:center;
    animation:popIn .55s var(--spring) both;
  }
  .lock-card.shake{animation:shake .42s var(--ease);}
  .lock-card .mark{
    width:40px;height:40px;border-radius:12px;
    background:var(--accent);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;font-weight:700;font-size:16px;
  }
  .lock-card h1{font-size:19px;margin:0 0 6px;color:var(--ink);letter-spacing:-.01em;}
  .lock-card p{font-size:14px;color:var(--ink-faint);margin:0 0 20px;}
  .lock-card input{
    width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius-sm);font-size:14px;text-align:center;letter-spacing:1px;
    outline:none;transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .lock-card input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-bg);}
  .lock-card button{
    width:100%;margin-top:12px;padding:12px;border:none;border-radius:var(--radius-sm);
    background:var(--charcoal);color:#fff;font-size:14px;font-weight:600;
    transition:transform .12s var(--ease), background .15s var(--ease);
  }
  .lock-card button:hover{background:#000;}
  .lock-card button:active{transform:scale(.97);}
  .lock-error{color:var(--danger);font-size:12px;height:16px;margin-top:10px;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  #app.visible{display:block;animation:fadeIn .45s var(--ease) both;}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(207,220,142,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    color:var(--ink);
    display:flex;align-items:center;gap:12px;
    padding:0 clamp(16px,2.2vw,26px);height:62px;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .progress{
    position:absolute;left:0;bottom:-1px;height:2px;width:100%;
    background:var(--charcoal);transform-origin:0 50%;transform:scaleX(0);
    opacity:.75;
  }
  .topbar .title{
    display:flex;align-items:center;gap:9px;
    font-size:17px;font-weight:700;white-space:nowrap;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .topbar .title .logo{
    width:30px;height:30px;border-radius:10px;background:var(--charcoal);color:var(--lime);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
    transition:transform .5s var(--spring);
  }
  .topbar .title:hover .logo{transform:rotate(-10deg) scale(1.08);}
  .topbar .search-wrap{flex:1;max-width:460px;position:relative;margin-left:clamp(8px,2vw,28px);}
  .topbar input[type=search]{
    width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.72);color:var(--ink);font-size:14.5px;outline:none;
    transition:background .2s var(--ease), border-color .2s var(--ease), box-shadow .25s var(--ease);
  }
  .topbar input[type=search]::placeholder{color:var(--ink-faint);}
  .topbar input[type=search]:focus{border-color:rgba(0,0,0,.2);background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.55), 0 8px 24px -10px rgba(0,0,0,.25);}
  .search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--ink-faint);font-size:13px;pointer-events:none;
  }
  .topbar .spacer{flex:1;}
  .tb-btn{
    background:rgba(255,255,255,.62);border:1px solid rgba(0,0,0,.06);color:var(--ink);
    padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;
    white-space:nowrap;
    display:flex;align-items:center;gap:5px;
    transition:background .2s var(--ease), transform .25s var(--spring), box-shadow .2s var(--ease), color .2s var(--ease);
  }
  .tb-btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(0,0,0,.3);}
  .tb-btn:active{transform:scale(.96);}
  .tb-btn.active{background:var(--charcoal);border-color:var(--charcoal);color:#ffffff;font-weight:700;}
  .tb-btn.icon-only{padding:9px 11px;}
  #refreshBtn.spin{animation:spin .7s var(--ease);}

  .layout{display:flex;max-width:min(1680px,96vw);margin:0 auto;align-items:flex-start;}
  .sidebar{
    width:250px;flex:0 0 250px;
    position:sticky;top:62px;
    max-height:calc(100vh - 62px);
    display:flex;flex-direction:column;
    padding:22px 4px 22px clamp(10px,1.6vw,18px);
  }
  .nav-panel{
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:24px;
    box-shadow:0 1px 2px rgba(0,0,0,.03), 0 18px 40px -24px rgba(0,0,0,.22);
    display:flex;flex-direction:column;min-height:0;
    animation:slideRight .6s var(--ease) both;
  }
  .nav-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:18px 20px 10px;
  }
  .nav-head .nh-title{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:.14em;}
  .nav-head .nh-sub{font-size:12px;color:var(--ink-faint);}
  .nav-list{position:relative;overflow-y:auto;padding:2px 10px 12px;scrollbar-width:none;}
  .nav-list::-webkit-scrollbar{display:none;}
  .nav-indicator{
    position:absolute;left:10px;right:10px;top:0;height:0;
    background:var(--charcoal);border-radius:14px;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.45);
    transition:transform .45s var(--spring), height .3s var(--ease), opacity .2s;
    opacity:0;pointer-events:none;
  }
  .sidebar a{
    position:relative;z-index:1;
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:var(--ink-soft);
    font-size:15px;padding:10px 12px;border-radius:14px;margin-bottom:2px;
    transition:background .2s var(--ease), color .25s var(--ease);
  }
  .sidebar a .num{
    font-size:11.5px;font-weight:700;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;width:18px;flex:0 0 auto;
    transition:color .25s var(--ease);
  }
  .sidebar a .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s var(--spring);}
  .sidebar a:hover{background:rgba(0,0,0,.045);color:var(--ink);}
  .sidebar a:hover .name{transform:translateX(3px);}
  .sidebar a.active{color:#fff;font-weight:600;background:transparent;}
  .sidebar a.active .num{color:var(--lime);}
  .sidebar .count{
    font-size:11.5px;color:var(--ink-faint);font-weight:600;
    min-width:24px;text-align:center;padding:2px 7px;border-radius:999px;
    background:rgba(0,0,0,.05);
    transition:background .25s var(--ease), color .25s var(--ease);
  }
  .sidebar a.active .count{background:var(--lime);color:var(--ink);}

  .content{flex:1;min-width:0;padding:clamp(18px,2.8vw,30px) clamp(16px,3.4vw,40px) 100px;}

  .empty-hint{
    text-align:center;color:var(--ink-faint);font-size:15px;padding:60px 0;
  }

  /* category section */
  .cat-section{margin-bottom:46px;scroll-margin-top:var(--scroll-offset);}
  .cat-section.hidden-by-search{display:none;}
  .cat-section{--sec:var(--lime);--sec-soft:var(--lime-soft);}
  .cat-section:nth-of-type(3n+2){--sec:var(--lavender);--sec-soft:var(--lavender-soft);}
  .cat-section:nth-of-type(3n){--sec:var(--charcoal);--sec-soft:#efefed;}
  .cat-head{
    display:flex;align-items:baseline;gap:12px;margin-bottom:16px;
    padding-left:14px;border-left:5px solid var(--sec);
  }
  .cat-head h2{font-size:24px;margin:0;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
  .cat-head .cat-sub{font-size:13px;color:var(--ink-faint);}
  .cat-head{align-items:center;}
  .cat-head input.cat-name-edit{
    display:none;font-family:inherit;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em;
    border:1px solid var(--line);background:#fff;border-radius:12px;padding:3px 10px;
    width:min(320px,60%);outline:none;transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .cat-head input.cat-name-edit:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-bg);}
  body.edit-mode .cat-head h2{display:none;}
  body.edit-mode .cat-head input.cat-name-edit{display:block;animation:fadeIn .3s var(--ease);}
  .cat-del{
    display:none;margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--ink-faint);
    font-size:13px;padding:6px 13px;border-radius:999px;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  body.edit-mode .cat-del{display:inline-block;animation:fadeIn .3s var(--ease);}
  .cat-del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg);}
  .add-cat-wrap{display:none;margin:6px 0 40px;}
  body.edit-mode .add-cat-wrap{display:block;animation:fadeIn .3s var(--ease);}
  .add-cat-btn{
    width:100%;padding:18px;border:1.5px dashed rgba(0,0,0,.16);border-radius:var(--radius);
    background:rgba(255,255,255,.35);color:var(--ink-soft);font-size:15px;font-weight:600;
    transition:border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease), transform .25s var(--spring);
  }
  .add-cat-btn:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-dark);transform:translateY(-2px);}
  .add-cat-wrap .mini-form{border-radius:var(--radius);border:1px solid var(--line);margin-top:10px;}
  .cat-section.just-added{animation:justAdded 1.6s var(--ease);}
  @keyframes justAdded{0%{opacity:0;transform:translateY(16px) scale(.98);}30%{opacity:1;transform:none;}
    30%,70%{background:rgba(207,220,142,.35);box-shadow:0 0 0 10px rgba(207,220,142,.35);border-radius:16px;}
    100%{background:transparent;box-shadow:0 0 0 10px rgba(207,220,142,0);}}
  /* 删除时的收起动画 */
  .leaving{
    overflow:hidden;pointer-events:none;
    transition:height .45s var(--ease), opacity .3s var(--ease), transform .45s var(--ease),
      margin .45s var(--ease), padding .45s var(--ease) !important;
  }
  .leaving.gone{opacity:0;transform:scale(.96);height:0 !important;margin-top:0 !important;margin-bottom:0 !important;padding-top:0 !important;padding-bottom:0 !important;}
  .field.leaving.gone{transform:scale(.8);}

  .cards-grid{display:flex;flex-direction:column;gap:16px;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    overflow:hidden;
    transition:box-shadow .35s var(--ease), transform .35s var(--ease);
  }
  .card:hover{box-shadow:0 2px 4px rgba(0,0,0,.03), 0 22px 44px -22px rgba(0,0,0,.24);}
  /* 进场动画：滚动到时淡入上浮 */
  .reveal{opacity:0;transform:translateY(22px) scale(.985);}
  .reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease), transform .7s var(--ease), box-shadow .35s var(--ease);}
  .card.hidden-by-search{display:none;}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--line-soft);
    background:var(--sec-soft);
    gap:8px;
  }
  .card-head h3{font-size:16.5px;margin:0;font-weight:650;color:var(--ink);letter-spacing:-.01em;}
  .card-head input.title-edit{
    display:none;
    font-size:16px;font-weight:600;color:var(--ink);border:1px solid transparent;
    background:transparent;padding:4px 6px;border-radius:var(--radius-sm);flex:1;min-width:0;
  }
  body.edit-mode .card-head h3.card-title-text{display:none;}
  body.edit-mode .card-head input.title-edit{display:block;border-color:var(--line);background:#fff;}
  .card-head .card-actions{display:none;gap:6px;flex:0 0 auto;}
  body.edit-mode .card-head .card-actions{display:flex;}
  .icon-btn{
    border:none;background:transparent;color:var(--ink-faint);
    width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;line-height:1;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .icon-btn:hover{background:var(--danger-bg);color:var(--danger);}

  .fields{
    display:flex;flex-wrap:wrap;gap:10px;
    padding:16px 20px 20px;
  }
  .field{
    background:var(--surface-alt);
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:10px 14px 11px;
    min-width:160px;
    flex:1 1 180px;
    position:relative;
    transition:background .2s var(--ease), box-shadow .25s var(--ease), transform .25s var(--spring), border-color .2s var(--ease);
  }
  .field.long{flex-basis:100%;}
  .field .f-label{
    font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:4px;
    letter-spacing:.02em;
  }
  .field .f-value{
    font-size:15.5px;color:var(--ink);line-height:1.6;
    word-break:break-word;white-space:pre-wrap;
    border-radius:4px;padding:1px 3px;margin:-1px -3px;
  }
  body:not(.edit-mode) .field{cursor:pointer;}
  body:not(.edit-mode) .field:hover{background:var(--accent-bg);border-color:rgba(169,189,69,.35);box-shadow:0 8px 18px -12px rgba(75,92,18,.35);transform:translateY(-2px);}
  body:not(.edit-mode) .field:active{transform:scale(.98);transition-duration:.08s;}
  .field.copied{background:var(--good-bg);animation:copiedPulse .5s var(--ease);}
  .field.copied::after{
    content:"✓ 已复制";
    position:absolute;top:8px;right:10px;
    font-size:11.5px;font-weight:700;color:#fff;background:var(--good);
    padding:3px 9px;border-radius:999px;
    animation:badgePop .9s var(--spring) both;pointer-events:none;
  }
  .field input.f-input, .field textarea.f-input{
    display:none;width:100%;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:15px;color:var(--ink);background:#fff;outline:none;resize:vertical;
    line-height:1.5;transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .field input.f-input:focus, .field textarea.f-input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-bg);}
  body.edit-mode .field .f-value{display:none;}
  body.edit-mode .field input.f-input, body.edit-mode .field textarea.f-input{display:block;animation:fadeIn .3s var(--ease);}
  .field.deleting{display:none;}
  .field .f-del{
    display:none;float:right;border:none;background:transparent;color:var(--ink-faint);
    font-size:13px;cursor:pointer;padding:0 0 0 6px;
  }
  body.edit-mode .field .f-del{display:inline;}
  .field .f-del:hover{color:var(--danger);}

  .add-row{padding:0 20px 18px;}
  .add-field-btn, .add-card-btn{
    display:none;
    border:1px dashed var(--line);background:transparent;color:var(--ink-soft);
    font-size:14px;padding:8px 15px;border-radius:999px;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  body.edit-mode .add-field-btn, body.edit-mode .add-card-btn{display:inline-block;animation:fadeIn .3s var(--ease);}
  .add-field-btn:hover, .add-card-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-bg);}
  .add-card-btn{margin-top:2px;}

  .mini-form{
    display:none;gap:8px;padding:14px 20px;background:var(--surface-alt);
    border-top:1px solid var(--line-soft);
  }
  .mini-form.open{display:flex;flex-wrap:wrap;align-items:center;animation:dropIn .35s var(--ease);}
  .mini-form input[type=text]{
    flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;
  }
  .mini-form select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;}
  .mini-form textarea{
    flex:1 1 100%;min-width:0;min-height:84px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    font-size:14.5px;line-height:1.55;font-family:inherit;color:var(--ink);background:#fff;outline:none;resize:vertical;
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .mini-form textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-bg);}
  .mini-form .mf-actions{display:flex;gap:8px;margin-left:auto;}
  .mini-form .mf-btn{
    border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;
    transition:transform .12s var(--ease), opacity .15s var(--ease);
  }
  .mini-form .mf-btn:active{transform:scale(.96);}
  .mini-form .mf-save{background:var(--ink);color:#fff;}
  .mini-form .mf-cancel{background:transparent;color:var(--ink-faint);}

  /* toast */
  #toastWrap{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;
  }
  .toast{
    background:rgba(29,29,31,.9);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    color:#fff;font-size:14px;padding:10px 20px;border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.24);opacity:0;transform:translateY(14px) scale(.92);
    transition:opacity .25s var(--ease), transform .45s var(--spring);
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* log drawer */
  #logDrawer{
    position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;
    background:var(--surface);box-shadow:var(--shadow-lg);
    z-index:60;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;
  }
  #logDrawer.open{transform:translateX(0);}
  #logOverlay{
    position:fixed;inset:0;background:rgba(29,29,31,.32);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    z-index:55;display:none;
  }
  #logOverlay.open{display:block;animation:fadeIn .3s var(--ease);}
  #logDrawer.open .log-item{animation:fadeUp .4s var(--ease) both;}
  #logDrawer.open .log-item:nth-child(2){animation-delay:.04s;}
  #logDrawer.open .log-item:nth-child(3){animation-delay:.08s;}
  #logDrawer.open .log-item:nth-child(4){animation-delay:.12s;}
  #logDrawer.open .log-item:nth-child(5){animation-delay:.16s;}

  .log-head{
    padding:16px 18px;border-bottom:1px solid var(--line);

  .log-head h2{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;}

  #logClearAll{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);

  .log-item .lt-path{color:var(--ink-soft);font-weight:600;}
  .log-item .lt-diff{color:var(--ink);line-height:1.5;}
  .log-item .lt-old{color:var(--danger);text-decoration:line-through;opacity:.7;}

  .log-item .lt-delete{

  }
  .log-item .lt-delete:hover{color:var(--danger);}
  .log-empty{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:40px 0;}

  /* responsive */
  @media (max-width: 880px){
    .layout{flex-direction:column;}
    .sidebar{
      position:sticky;top:62px;width:100%;flex:none;max-height:none;z-index:10;
      padding:8px 12px;
      background:rgba(235,235,232,.92);
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);

    .sidebar a.active{background:var(--charcoal);}
    .content{padding:16px 14px 80px;}
    .topbar .title{display:none;}
    #logDrawer{width:100%;max-width:100%;}
  }

  /* ---------- 动效 ---------- */
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes dropIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  @keyframes slideRight{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:none;}}
  @keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.94);}to{opacity:1;transform:none;}}
  @keyframes shake{0%,100%{transform:none;}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes copiedPulse{0%{box-shadow:0 0 0 0 rgba(107,134,28,.45);}100%{box-shadow:0 0 0 12px rgba(107,134,28,0);}}
  @keyframes badgePop{0%{opacity:0;transform:translateY(4px) scale(.6);}25%{opacity:1;transform:none;}80%{opacity:1;transform:none;}100%{opacity:0;transform:translateY(-4px);}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    .reveal{opacity:1;transform:none;}
  }

  /* ---------- 导出 PDF（打印版式） ---------- */
  #printArea{display:none;}
  #printArea{font-family:var(--font);color:#1d1d1f;font-size:9.5pt;line-height:1.5;}
  #printArea .p-title{margin:0 0 2pt;font-size:20pt;font-weight:700;letter-spacing:-.01em;}
  #printArea .p-sub{margin:0 0 14pt;font-size:9pt;color:#6e6e73;padding-bottom:8pt;border-bottom:1.2pt solid #a9bd45;}
  #printArea .p-cat{margin:0 0 6pt;}
  #printArea .p-cat > h2{
    margin:14pt 0 8pt;padding-left:7pt;border-left:3.2pt solid #a9bd45;
    font-size:13pt;font-weight:700;break-after:avoid;page-break-after:avoid;
  }
  #printArea .p-card{margin:0 0 9pt;padding:7pt 9pt 3pt;border:.6pt solid #dddcd6;border-radius:6pt;break-inside:avoid;page-break-inside:avoid;}
  #printArea .p-card.p-big{break-inside:auto;page-break-inside:auto;}
  #printArea .p-card > h3{margin:0 0 5pt;font-size:10.5pt;font-weight:700;color:#5d53a6;break-after:avoid;page-break-after:avoid;}
  #printArea .p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12pt;}
  #printArea .p-f{padding:3pt 0 4pt;border-top:.4pt solid #ececea;break-inside:avoid;page-break-inside:avoid;min-width:0;}
  #printArea .p-f.long{grid-column:1 / -1;}
  #printArea .p-l{font-size:7.5pt;font-weight:600;color:#8a8a8f;margin-bottom:1pt;}
  #printArea .p-v{white-space:pre-wrap;word-break:break-word;}

  @media print{
    @page{size:A4;margin:14mm 12mm;}
    html,body{background:#fff !important;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
    #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 配置 ----------
  const SUPABASE_URL = "https://xbmnadxitkzsofgizqew.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QNCf-to238GBDK0-GbLxXg_6bOr9a8t";
  const PASSWORD_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92";
  const LOCK_STORAGE_KEY = "zlk_unlocked";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- 小工具 ----------
  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    attrs = attrs || {};
    for(const k in attrs){
      const v = attrs[k];
      if(k === "class") e.className = v;
      else if(k === "text") e.textContent = v;
      else if(k.indexOf("on") === 0 && typeof v === "function") e.addEventListener(k.slice(2), v);
      else if(v !== null && v !== undefined) e.setAttribute(k, v);
    }
    children.flat().forEach(c=>{
      if(c === null || c === undefined) return;
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  async function sha256Hex(text){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  function showToast(msg){
    const wrap = document.getElementById("toastWrap");
    const t = el("div", {class:"toast"}, msg);
    wrap.appendChild(t);
    requestAnimationFrame(()=> t.classList.add("show"));
    setTimeout(()=>{
      t.classList.remove("show");
      setTimeout(()=> t.remove(), 250);
    }, 1600);
  }

  // 删除时的收起动画：先淡出缩小、高度收为 0，再从页面移除
  function animateOut(node){
    return new Promise(resolve=>{
      if(!node || !node.isConnected){ resolve(); return; }
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ node.remove(); resolve(); return; }
      node.style.height = node.offsetHeight + "px";
      node.classList.add("leaving");
      void node.offsetHeight;
      node.classList.add("gone");
      setTimeout(()=>{ node.remove(); resolve(); }, 470);
    });
  }

  function fmtTime(iso){
    const d = new Date(iso);
    const p = n => String(n).padStart(2,"0");
    return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---------- 密码门禁 ----------
  const lockScreen = document.getElementById("lockScreen");
  const app = document.getElementById("app");
  const pwInput = document.getElementById("pwInput");
  const pwError = document.getElementById("pwError");

  async function tryUnlock(pw){
    const hash = await sha256Hex(pw);
    if(hash === PASSWORD_HASH){
      localStorage.setItem(LOCK_STORAGE_KEY, "1");
      lockScreen.classList.add("hidden");
      app.classList.add("visible");
      boot();
    } else {
      pwError.textContent = "密码不对，再试试";
      const lc = document.querySelector(".lock-card");
      lc.classList.remove("shake"); void lc.offsetWidth; lc.classList.add("shake");
      pwInput.value = "";
      pwInput.focus();
    }
  }
  document.getElementById("pwSubmit").addEventListener("click", ()=> tryUnlock(pwInput.value));
  pwInput.addEventListener("keydown", e=>{ if(e.key === "Enter") tryUnlock(pwInput.value); });
  document.getElementById("lockBtn").addEventListener("click", ()=>{
    localStorage.removeItem(LOCK_STORAGE_KEY);
    location.reload();
  });

  if(localStorage.getItem(LOCK_STORAGE_KEY) === "1"){
    lockScreen.classList.add("hidden");
    app.classList.add("visible");
    boot();
  }

  // ---------- 数据状态 ----------
  let STATE = { categories: [], editMode: false };
  const saveTimers = {}; // fieldId -> timeout

  async function fetchAll(){
    const [catsRes, cardsRes, fieldsRes] = await Promise.all([
      sb.from("zlk_categories").select("*").order("order_index"),
      sb.from("zlk_cards").select("*").order("order_index"),
      sb.from("zlk_fields").select("*").order("order_index"),
    ]);
    if(catsRes.error || cardsRes.error || fieldsRes.error){
      console.error(catsRes.error || cardsRes.error || fieldsRes.error);
      showToast("加载失败，请检查网络后点右上角刷新");
      return null;
    }
    const cards = cardsRes.data.map(c => ({...c, fields: fieldsRes.data.filter(f=>f.card_id===c.id)}));
    const cats = catsRes.data.map(cat => ({...cat, cards: cards.filter(c=>c.category_id===cat.id)}));
    return cats;
  }

  async function loadAndRender(){
    const cats = await fetchAll();
    if(cats){
      STATE.categories = cats;
      render();
    }
  }

  function boot(){
    loadAndRender();
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible") loadAndRender();
    });
  }

  // ---------- 渲染 ----------
  const sidebarEl = document.getElementById("sidebar");
  const contentEl = document.getElementById("content");

  let scrollOffsetPx = 70;
  function updateScrollOffset(){
    const topbar = document.querySelector(".topbar");
    let offset = topbar ? topbar.offsetHeight : 62;
    if(window.innerWidth <= 880) offset += sidebarEl.offsetHeight;
    offset += 14;
    scrollOffsetPx = offset;
    document.documentElement.style.setProperty("--scroll-offset", offset + "px");
  }
  window.addEventListener("resize", updateScrollOffset);

  let firstRender = true;
  let navListEl = null, navIndicatorEl = null;

  function render(){
    const animate = firstRender;
    firstRender = false;
    const prevNavScroll = navListEl ? navListEl.scrollTop : 0;
    sidebarEl.innerHTML = "";
    contentEl.innerHTML = "";
    if(!STATE.categories.length){
      contentEl.appendChild(el("div",{class:"empty-hint"},"还没有数据"));
      return;
    }
    navIndicatorEl = el("span",{class:"nav-indicator"});
    navListEl = el("div",{class:"nav-list"}, navIndicatorEl);
    const panel = el("div",{class:"nav-panel"},
      el("div",{class:"nav-head"},
        el("span",{class:"nh-title", text:"目录"}),
        el("span",{class:"nh-sub", text:STATE.categories.length + " 类"})
      ),
      navListEl
    );
    if(!animate) panel.style.animation = "none";
    sidebarEl.appendChild(panel);

    STATE.categories.forEach((cat, idx)=>{
      const anchorId = "cat-" + cat.id;
      navListEl.appendChild(
        el("a", {href:"#"+anchorId, "data-cat":anchorId, onclick:(e)=>{
          e.preventDefault();
          document.getElementById(anchorId).scrollIntoView({behavior:"smooth", block:"start"});
        }},
          el("span",{class:"num", text:String(idx+1).padStart(2,"0")}),
          el("span",{class:"name", text:cat.name}),
          el("span",{class:"count", text:String(cat.cards.length)})
        )
      );

      const section = el("section",{class:"cat-section", id:anchorId, "data-cat-name":cat.name});
      const nameInput = el("input",{class:"cat-name-edit", type:"text", value:cat.name, title:"修改分类名称"});
      nameInput.addEventListener("change", ()=> saveCategoryName(cat, nameInput, section));
      nameInput.addEventListener("keydown", e=>{ if(e.key === "Enter") nameInput.blur(); });
      section.appendChild(
        el("div",{class:"cat-head"},
          el("h2",{text:cat.name}),
          nameInput,
          el("span",{class:"cat-sub", text:`${cat.cards.length} 张卡片`}),
          el("button",{class:"cat-del", title:"删除整个分类", onclick:()=> deleteCategory(cat, section)}, "删除分类")
        )
      );
      const grid = el("div",{class:"cards-grid"});
      cat.cards.forEach(card => grid.appendChild(renderCard(cat, card)));
      section.appendChild(grid);
      section.appendChild(
        el("button",{class:"add-card-btn", onclick:()=> openAddCardForm(cat, section)}, "＋ 添加卡片")
      );
      contentEl.appendChild(section);
    });
    contentEl.appendChild(renderAddCategory());
    navListEl.scrollTop = prevNavScroll;
    applyEditModeClass();
    updateScrollOffset();
    setupScrollSpy();
    if(animate) setupReveal();
  }

  // 卡片滚动进场：只在第一次渲染时做，之后自动刷新不再重播
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function setupReveal(){
    if(reduceMotion) return;
    let pending = Array.from(contentEl.querySelectorAll(".cat-head, .card"));
    pending.forEach(t=> t.classList.add("reveal"));
    let ticking = false;
    function check(){
      ticking = false;
      const vh = window.innerHeight;
      let i = 0;
      pending = pending.filter(t=>{
        if(!t.isConnected) return false;
        const r = t.getBoundingClientRect();
        if(r.top < vh - 30 && r.bottom > 0){
          t.style.transitionDelay = Math.min(i++ * 70, 420) + "ms";
          t.classList.add("in");
          setTimeout(()=>{ t.style.transitionDelay = ""; t.classList.remove("reveal","in"); }, 1300);
          return false;
        }
        // 跳过去的（已经在视口上方）直接显示，不做动画
        if(r.bottom <= 0){ t.classList.remove("reveal"); return false; }
        return true;
      });
      if(!pending.length){
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onScroll);
      }
    }
    function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(check); } }
    window.addEventListener("scroll", onScroll, {passive:true});
    window.addEventListener("resize", onScroll);
    requestAnimationFrame(check);
  }

  function renderCard(cat, card){
    const cardEl = el("div",{class:"card", "data-card-id":card.id, "data-card-title":card.title});

    const titleInput = el("input",{class:"title-edit", type:"text", value:card.title});
    titleInput.addEventListener("change", ()=> saveCardTitle(card, titleInput.value));

    const head = el("div",{class:"card-head"},
      el("h3",{class:"card-title-text", text:card.title}),
      titleInput,
      el("div",{class:"card-actions"},
        el("button",{class:"icon-btn", title:"删除卡片", onclick:()=> deleteCard(cat, card, cardEl)}, "✕")
      )
    );
    cardEl.appendChild(head);

    const fieldsWrap = el("div",{class:"fields"});
    card.fields.forEach(f => fieldsWrap.appendChild(renderField(cat, card, f)));
    cardEl.appendChild(fieldsWrap);

    cardEl.appendChild(
      el("div",{class:"add-row"},
        el("button",{class:"add-field-btn", onclick:()=> openAddFieldForm(cat, card, cardEl)}, "＋ 添加字段")
      )
    );
    const mf = el("div",{class:"mini-form", "data-role":"add-field-form"});
    cardEl.appendChild(mf);

    return cardEl;
  }

  function escapeHtml(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // 带换行的内容同时写入纯文本和 HTML 两种格式：多行输入框取纯文本，富文本编辑器取 HTML（<br>），换行都不会丢
  async function writeClipboard(text){
    if(text.indexOf("\n") !== -1 && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      try{
        const html = "<div>" + text.split(/\r?\n/).map(escapeHtml).join("<br>") + "</div>";
        await navigator.clipboard.write([new ClipboardItem({
          "text/plain": new Blob([text], {type:"text/plain"}),
          "text/html": new Blob([html], {type:"text/html"})
        })]);
        return;
      }catch(e){ /* 浏览器不允许就退回普通复制 */ }
    }
    await navigator.clipboard.writeText(text);
  }

  function renderField(cat, card, field){
    const isLong = field.field_type === "long";
    const wrap = el("div",{class:"field" + (isLong ? " long" : ""), "data-field-id":field.id});

    const valueEl = el("div",{class:"f-value", tabindex:"0"}, field.value || "");
    wrap.addEventListener("click", ()=>{
      if(STATE.editMode) return;
      const text = valueEl.textContent;
      if(!text) return;
      writeClipboard(text).then(()=>{
        clearTimeout(wrap._copiedTimer);
        wrap.classList.remove("copied"); void wrap.offsetWidth;
        wrap.classList.add("copied");
        wrap._copiedTimer = setTimeout(()=> wrap.classList.remove("copied"), 950);
        showToast("已复制「" + field.label + "」");
      }).catch(()=> showToast("复制失败，请手动选中"));
    });

    const multiline = isLong || /[\r\n]/.test(field.value || "");
    const inputEl = multiline
      ? el("textarea",{class:"f-input", rows:"3"})
      : el("input",{class:"f-input", type:"text"});
    inputEl.value = field.value || "";
    let originalValue = field.value || "";

    async function persistEdit(newVal){
      const { error } = await sb.from("zlk_fields").update({value:newVal}).eq("id", field.id);
      if(error){ showToast("保存失败"); console.error(error); return; }
      await sb.from("zlk_edit_logs").insert({
        field_id: field.id,
        field_label_snapshot: field.label,
        card_title_snapshot: card.title,
        card_id: card.id,
        old_value: originalValue,
        new_value: newVal,
        action_type: "edit"
      });
      originalValue = newVal;
      field.value = newVal;
      valueEl.textContent = newVal;
      showToast("已自动保存");
    }
    function scheduleSave(){
      clearTimeout(saveTimers[field.id]);
      saveTimers[field.id] = setTimeout(()=>{
        const newVal = inputEl.value;
        if(newVal === originalValue) return;
        persistEdit(newVal);
      }, 800);
    }
    inputEl.addEventListener("input", scheduleSave);
    inputEl.addEventListener("blur", ()=>{
      clearTimeout(saveTimers[field.id]);
      const newVal = inputEl.value;
      if(newVal === originalValue) return;
      persistEdit(newVal);
    });

    const delBtn = el("button",{class:"f-del", title:"删除字段", onclick: async ()=>{
      if(!confirm(`删除字段「${field.label}」？`)) return;
      try{
        await deleteFieldWithLog(card, field, "delete");
        card.fields = card.fields.filter(f=> f.id !== field.id);
        animateOut(wrap);
        showToast("已删除字段");
      }catch(err){ console.error(err); showToast("删除失败"); }
    }}, "✕");

    wrap.appendChild(el("div",{class:"f-label"}, field.label, delBtn));
    wrap.appendChild(valueEl);
    wrap.appendChild(inputEl);
    return wrap;
  }

  function applyEditModeClass(){
    document.body.classList.toggle("edit-mode", STATE.editMode);
  }

  // ---------- 日志读写核心操作（新建/删除字段、卡片，供直接操作和回滚共用） ----------

      field_id: data.id,
      field_label_snapshot: label,
      card_title_snapshot: cardTitle,
      card_id: cardId,
      old_value: null,

  async function restoreCardWithLog(categoryId, title, fieldsSnapshot, actionType){
    const { count } = await sb.from("zlk_cards").select("id",{count:"exact", head:true}).eq("category_id", categoryId);
    const { data: newCard, error } = await sb.from("zlk_cards")
      .insert({category_id:categoryId, title, order_index:(count||0)+1})
      .select().single();
    if(error) throw error;
    for(let i=0;i<fieldsSnapshot.length;i++){
      const f = fieldsSnapshot[i];
      await sb.from("zlk_fields").insert({
        card_id:newCard.id, label:f.label, value:f.value, field_type:f.field_type || "short", order_index:i+1

    await sb.from("zlk_edit_logs").insert({
      field_id: null,
      field_label_snapshot: "新建卡片",
      card_title_snapshot: title,
      card_id: newCard.id,
      category_id: categoryId,
      old_value: null,
      new_value: title,
      action_type: actionType
    });
    return newCard;
  }

  async function snapshotCategory(categoryId){
    const [catRes, cardsRes] = await Promise.all([
      sb.from("zlk_categories").select("*").eq("id", categoryId).limit(1),
      sb.from("zlk_cards").select("*").eq("category_id", categoryId).order("order_index"),
    ]);
    if(catRes.error || cardsRes.error) throw (catRes.error || cardsRes.error);
    if(!catRes.data || !catRes.data.length) return null;
    const cards = cardsRes.data || [];
    let fields = [];
    if(cards.length){
      const fRes = await sb.from("zlk_fields").select("*").in("card_id", cards.map(c=>c.id)).order("order_index");
      if(fRes.error) throw fRes.error;
      fields = fRes.data || [];
    }
    const c = catRes.data[0];
    return {
      name: c.name, order_index: c.order_index,
      cards: cards.map(cd=>({
        title: cd.title, order_index: cd.order_index,
        fields: fields.filter(f=> f.card_id === cd.id).map(f=>({label:f.label, value:f.value, field_type:f.field_type}))
      }))
    };
  }

  async function deleteCategoryWithLog(categoryId, actionType){
    const snap = await snapshotCategory(categoryId);
    if(!snap) throw new Error("分类不存在");
    const { error: logErr } = await sb.from("zlk_edit_logs").insert({
      field_id:null, field_label_snapshot:"删除分类", card_title_snapshot:snap.name,
      category_id:categoryId, old_value:JSON.stringify(snap), new_value:null, action_type:actionType
    });
    if(logErr) throw logErr;   // 记录没存上就不删，免得删了没法恢复
    const { error } = await sb.from("zlk_categories").delete().eq("id", categoryId);
    if(error) throw error;
    return snap;
  }

  async function restoreCategoryWithLog(snap, actionType){
    const { data: newCat, error } = await sb.from("zlk_categories")
      .insert({name:snap.name, order_index:snap.order_index}).select().single();
    if(error) throw error;
    for(let i=0;i<(snap.cards||[]).length;i++){
      const cd = snap.cards[i];
      const { data: newCard, error: cErr } = await sb.from("zlk_cards")
        .insert({category_id:newCat.id, title:cd.title, order_index:cd.order_index != null ? cd.order_index : i+1}).select().single();
      if(cErr) throw cErr;
      const rows = (cd.fields||[]).map((f,j)=>({card_id:newCard.id, label:f.label, value:f.value, field_type:f.field_type || "short", order_index:j+1}));
      if(rows.length){
        const { error: fErr } = await sb.from("zlk_fields").insert(rows);
        if(fErr) throw fErr;
      }
    }
    await sb.from("zlk_edit_logs").insert({
      field_id:null, field_label_snapshot:"新建分类", card_title_snapshot:snap.name,
      category_id:newCat.id, old_value:null, new_value:snap.name, action_type:actionType
    });
    return newCat;
  }

  // ---------- 导出 PDF（用浏览器的打印功能“另存为 PDF”，文字可选中、中文不会乱码） ----------
  const printAreaEl = document.getElementById("printArea");
  const pad2 = n => String(n).padStart(2,"0");
  let savedTitle = null;

  function findPersonName(cats){
    for(const cat of cats) for(const card of cat.cards) for(const f of card.fields){
      if(f.label === "姓名" && (f.value||"").trim()) return f.value.trim();
    }
    return "";
  }

  function setPrintTitle(cats){
    if(savedTitle === null) savedTitle = document.title;
    const name = findPersonName(cats);
    const d = new Date();
    document.title = "网申资料" + (name ? "-" + name : "") + "-" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
  }

  function buildPrintArea(cats){
    const now = new Date();
    const stamp = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const name = findPersonName(cats);
    printAreaEl.textContent = "";
    printAreaEl.appendChild(el("h1",{class:"p-title", text: name ? name + " · 网申资料" : "网申资料"}));
    printAreaEl.appendChild(el("div",{class:"p-sub", text:"导出时间：" + stamp}));
    cats.forEach(cat=>{
      const cards = cat.cards
        .map(card => ({ card, fields: card.fields.filter(f => (f.value||"").trim() !== "") }))
        .filter(x => x.fields.length);
      if(!cards.length) return;
      const sec = el("section",{class:"p-cat"}, el("h2",{text:cat.name}));
      cards.forEach(({card, fields})=>{
        const shorts = fields.filter(f => f.field_type !== "long").length;
        const longUnits = fields.filter(f => f.field_type === "long").reduce((n,f)=> n + 1.3 + Math.ceil(f.value.length/52), 0);
        const tooTall = Math.ceil(shorts/3)*2.6 + longUnits > 38;   // 估算比较高的卡片允许跨页，其余卡片尽量不被拆开
        const grid = el("div",{class:"p-grid"});
        fields.forEach(f => grid.appendChild(
          el("div",{class:"p-f" + (f.field_type === "long" ? " long" : "")},
            el("div",{class:"p-l", text:f.label}),
            el("div",{class:"p-v", text:f.value}))
        ));
        sec.appendChild(el("div",{class:"p-card" + (tooTall ? " p-big" : "")}, el("h3",{text:card.title}), grid));
      });
      printAreaEl.appendChild(sec);
    });
  }

  async function exportPdf(){
    const btn = document.getElementById("pdfBtn");
    if(btn.disabled) return;
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "准备中…";
    try{
      if(STATE.editMode) await new Promise(r => setTimeout(r, 500));   // 等正在输入的内容先自动保存完
      const fresh = await fetchAll();                                  // 重新读一遍数据库，保证导出的是最新内容
      const cats = fresh || STATE.categories;
      if(!cats.length){ showToast("还没有内容可以导出"); return; }
      buildPrintArea(cats);
      setPrintTitle(cats);
      showToast("请在打印窗口里把目标选为「另存为 PDF」");
      await new Promise(r => setTimeout(r, 700));
      window.print();
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }
  document.getElementById("pdfBtn").addEventListener("click", exportPdf);

  // ---------- 侧边栏滚动高亮 ----------
  function setupScrollSpy(){
    const sections = Array.from(document.querySelectorAll(".cat-section"));
    if(!sections.length) return;
    const links = Array.from(sidebarEl.querySelectorAll("a"));
    const bar = document.getElementById("progressBar");
    let lastActive = null;
    const spy = ()=>{
      let currentId = sections[0].id;
      const y = window.scrollY + scrollOffsetPx;
      sections.forEach(s=>{ if(s.offsetTop <= y) currentId = s.id; });
      let activeLink = null;
      links.forEach(l=>{
        const on = l.getAttribute("data-cat") === currentId;
        l.classList.toggle("active", on);
        if(on) activeLink = l;
      });
      // 顶栏下方的阅读进度条
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if(bar) bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
      // 目录里滑动的高亮块
      if(activeLink && navIndicatorEl){
        navIndicatorEl.style.height = activeLink.offsetHeight + "px";
        navIndicatorEl.style.transform = "translateY(" + activeLink.offsetTop + "px)";
        navIndicatorEl.style.opacity = "1";
        if(activeLink !== lastActive && navListEl){
          const top = activeLink.offsetTop, bottom = top + activeLink.offsetHeight;
          if(top < navListEl.scrollTop + 8) navListEl.scrollTo({top: top - 8, behavior:"smooth"});
          else if(bottom > navListEl.scrollTop + navListEl.clientHeight - 8) navListEl.scrollTo({top: bottom - navListEl.clientHeight + 8, behavior:"smooth"});
        }
        lastActive = activeLink;
      }
    };
    window.removeEventListener("scroll", window._zlkSpy || (()=>{}));
    window._zlkSpy = spy;
    window.addEventListener("scroll", spy, {passive:true});
    window.removeEventListener("resize", window._zlkSpyResize || (()=>{}));
    window._zlkSpyResize = spy;
    window.addEventListener("resize", spy);
    spy();
  }

  async function openLogDrawer(){
    logDrawer.classList.add("open");
    logOverlay.classList.add("open");
    logList.innerHTML = "<div class='log-empty'>加载中…</div>";
    const [logsRes, cardsRes, fieldsRes, catsRes] = await Promise.all([
      sb.from("zlk_edit_logs").select("*").order("edited_at", {ascending:false}).limit(200),
      sb.from("zlk_cards").select("id"),
      sb.from("zlk_fields").select("id"),
      sb.from("zlk_categories").select("id"),
    ]);
    existingCatIds = new Set((catsRes.data||[]).map(c=>c.id));
    if(logsRes.error){ logList.innerHTML = "<div class='log-empty'>加载失败</div>"; return; }
    const data = logsRes.data;
    if(!data.length){ logList.innerHTML = "<div class='log-empty'>还没有修改记录</div>"; return; }
    const existingCardIds = new Set((cardsRes.data||[]).map(c=>c.id));
    const existingFieldIds = new Set((fieldsRes.data||[]).map(f=>f.id));
    logList.innerHTML = "";
    data.forEach(log => logList.appendChild(renderLogItem(log, existingCardIds, existingFieldIds)));
  }
  let existingCatIds = new Set();
  function closeLogDrawer(){
    logDrawer.classList.remove("open");
    logOverlay.classList.remove("open");
  }
  document.getElementById("logBtn").addEventListener("click", openLogDrawer);
  document.getElementById("logClose").addEventListener("click", closeLogDrawer);
  logOverlay.addEventListener("click", closeLogDrawer);
  document.getElementById("logClearAll").addEventListener("click", async ()=>{
    if(!confirm("这会清空所有修改历史，且不可恢复，确定吗？")) return;
    const { error } = await sb.from("zlk_edit_logs").delete().not("id", "is", null);
    if(error){ showToast("清空失败"); console.error(error); return; }
    showToast("已清空所有记录");
    openLogDrawer();
  });

  function actionLabel(t){
    return {edit:"修改", create:"新建", delete:"删除", rollback:"回滚"}[t] || t;
  }

  // 根据日志内容判断这是哪一种记录（不依赖 action_type，避免外键 on delete set null 把线索清空后无法分类）
  function classifyLog(log){
    const label = log.field_label_snapshot;
    if(label === "删除卡片") return "CARD_DELETE";
    if(label === "新建卡片") return "CARD_CREATE";
    if(label === "卡片标题") return "CARD_TITLE_EDIT";
    if(label === "删除分类") return "CAT_DELETE";
    if(label === "新建分类") return "CAT_CREATE";
    if(label === "分类名称") return "CAT_RENAME";
    if(log.old_value === null) return "FIELD_CREATE";
    if(log.new_value === null) return "FIELD_DELETE";
    return "FIELD_EDIT";
  }

  function rollbackInfo(log, kind, existingCardIds, existingFieldIds){
    switch(kind){
      case "FIELD_EDIT":
        return (log.field_id && existingFieldIds.has(log.field_id))
          ? {ok:true} : {ok:false, reason:"该字段已被删除，无法回滚"};
      case "CARD_TITLE_EDIT":
        return (log.card_id && existingCardIds.has(log.card_id))
          ? {ok:true} : {ok:false, reason:"该卡片已被删除，无法回滚"};
      case "FIELD_CREATE":
        return (log.field_id && existingFieldIds.has(log.field_id))
          ? {ok:true} : {ok:false, reason:"该字段已被删除，无法回滚"};
      case "CARD_CREATE":
        return (log.card_id && existingCardIds.has(log.card_id))
          ? {ok:true} : {ok:false, reason:"该卡片已被删除，无法回滚"};
      case "FIELD_DELETE":
        return (log.card_id && existingCardIds.has(log.card_id))
          ? {ok:true} : {ok:false, reason:"所在卡片已被删除，无法回滚"};
      case "CARD_DELETE":
        return (log.category_id && existingCatIds.has(log.category_id))
          ? {ok:true} : {ok:false, reason:"所在分类已被删除，请先恢复分类"};
      case "CAT_DELETE":
        return {ok:true};
      case "CAT_CREATE":
      case "CAT_RENAME":
        return (log.category_id && existingCatIds.has(log.category_id))
          ? {ok:true} : {ok:false, reason:"该分类已被删除，无法回滚"};
      default:
        return {ok:false, reason:null};
    }
  }

  async function performRollback(log, kind){
    try{
      if(kind === "FIELD_EDIT"){
        const { data: rows } = await sb.from("zlk_fields").select("*").eq("id", log.field_id).limit(1);
        if(!rows || !rows.length){ showToast("该字段已被删除，无法回滚"); return; }
        if(!confirm("回滚到这个版本吗？")) return;
        const cur = rows[0];
        const { error } = await sb.from("zlk_fields").update({value: log.old_value}).eq("id", log.field_id);
        if(error) throw error;
        await sb.from("zlk_edit_logs").insert({
          field_id: log.field_id, field_label_snapshot: log.field_label_snapshot,
          card_title_snapshot: log.card_title_snapshot, card_id: log.card_id,
          old_value: cur.value, new_value: log.old_value, action_type: "rollback"
        });
      } else if(kind === "CARD_TITLE_EDIT"){
        const { data: rows } = await sb.from("zlk_cards").select("*").eq("id", log.card_id).limit(1);
        if(!rows || !rows.length){ showToast("该卡片已被删除，无法回滚"); return; }
        if(!confirm("回滚到这个版本吗？")) return;
        const cur = rows[0];
        const { error } = await sb.from("zlk_cards").update({title: log.old_value}).eq("id", log.card_id);
        if(error) throw error;
        await sb.from("zlk_edit_logs").insert({
          field_id:null, field_label_snapshot:"卡片标题",
          card_title_snapshot: log.old_value, card_id: log.card_id,
          old_value: cur.title, new_value: log.old_value, action_type: "rollback"
        });
      } else if(kind === "FIELD_CREATE"){
        const { data: rows } = await sb.from("zlk_fields").select("*").eq("id", log.field_id).limit(1);
        if(!rows || !rows.length){ showToast("该字段已被删除，无法回滚"); return; }
        const field = rows[0];
        if(!confirm(`回滚将删除字段「${field.label}」，确定吗？`)) return;
        await deleteFieldWithLog({id: field.card_id, title: log.card_title_snapshot}, field, "rollback");
      } else if(kind === "CARD_CREATE"){
        const { data: rows } = await sb.from("zlk_cards").select("*").eq("id", log.card_id).limit(1);
        if(!rows || !rows.length){ showToast("该卡片已被删除，无法回滚"); return; }
        const card = rows[0];
        if(!confirm(`回滚将删除卡片「${card.title}」及其所有字段，确定吗？`)) return;
        await deleteCardWithLog({id: log.category_id}, card, "rollback");
      } else if(kind === "FIELD_DELETE"){
        const { data: rows } = await sb.from("zlk_cards").select("*").eq("id", log.card_id).limit(1);
        if(!rows || !rows.length){ showToast("所在卡片已被删除，无法回滚"); return; }
        const card = rows[0];
        if(!confirm(`回滚将恢复字段「${log.field_label_snapshot}」，确定吗？`)) return;
        await restoreFieldWithLog(card.id, card.title, log.field_label_snapshot, log.old_value, log.field_type_snapshot, "rollback");
      } else if(kind === "CARD_DELETE"){
        let fieldsSnapshot = [];
        try{ fieldsSnapshot = JSON.parse(log.old_value || "[]"); }catch(e){}
        if(!confirm(`回滚将恢复卡片「${log.card_title_snapshot}」及其 ${fieldsSnapshot.length} 个字段，确定吗？`)) return;
        await restoreCardWithLog(log.category_id, log.card_title_snapshot, fieldsSnapshot, "rollback");
      } else if(kind === "CAT_DELETE"){
        let snap = null;
        try{ snap = JSON.parse(log.old_value || "null"); }catch(e){}
        if(!snap){ showToast("这条记录没有保存内容，无法恢复"); return; }
        const n = (snap.cards||[]).length;
        if(!confirm(`回滚将恢复分类「${snap.name}」及其 ${n} 张卡片，确定吗？`)) return;
        await restoreCategoryWithLog(snap, "rollback");
      } else if(kind === "CAT_CREATE"){
        const { data: rows } = await sb.from("zlk_categories").select("*").eq("id", log.category_id).limit(1);
        if(!rows || !rows.length){ showToast("该分类已被删除，无法回滚"); return; }
        if(!confirm(`回滚将删除分类「${rows[0].name}」及其所有卡片，确定吗？`)) return;
        await deleteCategoryWithLog(log.category_id, "rollback");
      } else if(kind === "CAT_RENAME"){
        const { data: rows } = await sb.from("zlk_categories").select("*").eq("id", log.category_id).limit(1);
        if(!rows || !rows.length){ showToast("该分类已被删除，无法回滚"); return; }
        if(!confirm("回滚到这个版本吗？")) return;
        const cur = rows[0];
        const { error } = await sb.from("zlk_categories").update({name: log.old_value}).eq("id", log.category_id);
        if(error) throw error;
        await sb.from("zlk_edit_logs").insert({
          field_id:null, field_label_snapshot:"分类名称", card_title_snapshot: log.old_value,
          category_id: log.category_id, old_value: cur.name, new_value: log.old_value, action_type:"rollback"
        });
      } else {
        return;
      }
      showToast("已回滚");
      openLogDrawer();
      loadAndRender();
    }catch(err){
      console.error(err);
      showToast("回滚失败");
    }
  }

  function diffLine(log, kind){
    if(kind === "CARD_DELETE"){
      let n = 0;
      try{ n = JSON.parse(log.old_value || "[]").length; }catch(e){}
      return el("div",{class:"lt-diff"}, `该卡片删除时包含 ${n} 个字段`);
    }
    if(kind === "CAT_DELETE"){
      let n = 0;
      try{ n = (JSON.parse(log.old_value || "{}").cards || []).length; }catch(e){}
      return el("div",{class:"lt-diff"}, `该分类删除时包含 ${n} 张卡片`);
    }
    return el("div",{class:"lt-diff"},
      log.old_value ? el("span",{class:"lt-old"}, truncate(log.old_value)) : el("span",{},"（空）"),
      " → ",
      log.new_value ? el("span",{class:"lt-new"}, truncate(log.new_value)) : el("span",{},"（空）")
    );
  }

  function renderLogItem(log, existingCardIds, existingFieldIds){
    const kind = classifyLog(log);
    const item = el("div",{class:"log-item"},
      el("div",{class:"lt-top"},
        el("span",{text: fmtTime(log.edited_at) + " · " + actionLabel(log.action_type)}),
      ),
      el("div",{class:"lt-path", text:(log.card_title_snapshot||"") + " · " + (log.field_label_snapshot||"")}),
      diffLine(log, kind)
    );
    const info = rollbackInfo(log, kind, existingCardIds, existingFieldIds);
    const actionsRow = el("div",{class:"lt-actions"});
    if(info.ok){
      actionsRow.appendChild(el("button",{class:"lt-rollback", onclick: ()=> performRollback(log, kind)}, "回滚到这个版本"));
    } else if(info.reason){
      actionsRow.appendChild(el("span",{class:"lt-disabled", text: info.reason}));
    } else {
      actionsRow.appendChild(el("span",{}));
    }
    actionsRow.appendChild(el("button",{class:"lt-delete", title:"删除这条记录", onclick: async ()=>{
      if(!confirm("删除这条修改记录吗？")) return;
      const { error } = await sb.from("zlk_edit_logs").delete().eq("id", log.id);
      if(error){ showToast("删除失败"); console.error(error); return; }
      item.remove();
      if(!logList.querySelector(".log-item")) logList.innerHTML = "<div class='log-empty'>还没有修改记录</div>";
      showToast("已删除记录");
    }}, "删除记录"));
    item.appendChild(actionsRow);
    return item;
  }

  function truncate(s){
    s = String(s);
    return s.length > 40 ? s.slice(0,40) + "…" : s;
  }

})();
</script>
</body>
</html>
